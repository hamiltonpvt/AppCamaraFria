<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Estrutura da Câmara</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1, h2 { color: #1e3a8a; margin-top: 0; }
        .header-acoes { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-voltar { display: inline-block; background-color: #6b7280; color: white; text-decoration: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; font-size: 14px; }
        .btn-sync { background-color: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        .btn-sync:hover { background-color: #0056b3; }

        /* Formulário */
        .form-add { display: flex; gap: 15px; background: #f9fafb; padding: 15px; border-radius: 6px; margin-bottom: 25px; align-items: flex-end; border: 1px solid #e5e7eb; }
        .campo { display: flex; flex-direction: column; flex: 1; }
        label { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #4b5563; }
        input, select { padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; }
        .btn-salvar { background-color: #1e3a8a; color: white; border: none; padding: 9px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; }

        /* Tabela */
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background-color: #f3f4f6; color: #1e3a8a; }
        .btn-acao { border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-right: 5px; font-size: 12px; }
        .btn-editar { background-color: #f59e0b; color: white; }
        .btn-excluir { background-color: #ef4444; color: white; }
        .alerta-erro { background-color: #fee2e2; border: 1px solid #fca5a5; padding: 12px; border-radius: 4px; color: #991b1b; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-acoes">
            <a href="index.html" class="btn-voltar">⬅ Voltar ao Mapa Operacional</a>
            <button class="btn-sync" onclick="notificarOutrasPaginas()">🔄 Atualizar Outra Página</button>
        </div>

        <h2>Acrescentar Nova Posição (Fileira / Estante)</h2>
        <form id="formEspaco" class="form-add">
            <input type="hidden" id="espaco_id">
            <div class="campo">
                <label>Frio Disponível (°C)</label>
                <input type="number" step="0.1" id="temperatura_disponivel" placeholder="Ex: -18.0" required>
            </div>

            <div class="campo">
                <label>Fileira (Letra)</label>
                <input type="text" id="fileira" maxlength="1" placeholder="Ex: C" required>
            </div>
            <div class="campo">
                <label>Número / Estante</label>
                <input type="number" id="numero_espaco" placeholder="Ex: 4" required>
            </div>
            <div class="campo">
                <label>Status</label>
                <select id="status_espaco">
                    <option value="disponivel">Disponível</option>
                    <option value="manutencao">Manutenção</option>
                </select>
            </div>
            <button type="submit" class="btn-salvar" id="btnAcaoForm">Adicionar</button>
        </form>

        <h1>Estrutura Atual de Prateleiras</h1>
        <div id="mensagemErro"></div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Fileira (Letra)</th>
                    <th>Número (Espaço)</th>
                    <th>Frio Local</th>
                    <th>Status Atual</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaEspacos"></tbody>
        </table>

    </div>

    <script>
        const BASE_URL = 'https://film-disinfect-famished.ngrok-free.dev';
        const HEADERS_PADRAO = {
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
        };

        // -------------------------------------------------------------
        // CANAL DE COMUNICAÇÃO ENTRE ABAS (BroadcastChannel)
        // -------------------------------------------------------------
        const canalComunicacao = new BroadcastChannel('painel_camara_fria');

        // Notifica as outras abas/páginas para se atualizarem
        function notificarOutrasPaginas() {
            canalComunicacao.postMessage({ acao: 'ATUALIZAR' });
        }

        // Escuta comandos vindos do index.html ou de outras abas
        canalComunicacao.onmessage = (event) => {
            if (event.data && event.data.acao === 'ATUALIZAR') {
                listarEspacos();
            }
        };
        // -------------------------------------------------------------

        // 1. LISTA OS ESPAÇOS E AS TEMPERATURAS NA TABELA
        async function listarEspacos() {
            const tabela = document.getElementById('tabelaEspacos');
            const mensagemErro = document.getElementById('mensagemErro');
            mensagemErro.innerHTML = '';

            try {
                const resposta = await fetch(`${BASE_URL}/camara-fria/layout`, {
                    method: 'GET',
                    headers: HEADERS_PADRAO
                });

                if (!resposta.ok) {
                    throw new Error(`Erro na API: ${resposta.status}`);
                }

                const dados = await resposta.json();
                tabela.innerHTML = '';

                if (!Array.isArray(dados) || dados.length === 0) {
                    tabela.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#6b7280;">Nenhuma prateleira cadastrada.</td></tr>';
                    return;
                }

                dados.forEach(item => {
                    const idReal = item.id || item.espaco_id || item.numero_espaco;
                    const linha = document.createElement('tr');
                    linha.innerHTML = `
                        <td>${idReal}</td>
                        <td><strong>Fileira ${item.fileira}</strong></td>
                        <td>Espaço ${item.numero_espaco}</td>
                        <td><span style="color: #1e3a8a; font-weight:bold;">${item.temperatura_disponivel}°C</span></td>
                        <td><span style="color: ${item.status === 'ocupado' ? '#ef4444' : '#10b981'}; font-weight:bold;">${item.status}</span></td>
                        <td>
                            <button class="btn-acao btn-editar" onclick="prepararEdicao(${idReal}, '${item.fileira}', ${item.numero_espaco}, '${item.status}', ${item.temperatura_disponivel})">Alterar</button>
                            <button class="btn-acao btn-excluir" onclick="deletarEspaco(${idReal})">Excluir</button>
                        </td>
                    `;
                    tabela.appendChild(linha);
                });
            } catch (e) {
                console.error(e);
                mensagemErro.innerHTML = `<div class="alerta-erro">⚠️ Erro ao conectar ao servidor em <code>${BASE_URL}</code>. Verifique a API e as permissões de CORS.</div>`;
            }
        }

        // 2. PROCESSA O ENVIO DO FORMULÁRIO (ADICIONAR OU ALTERAR)
        document.getElementById('formEspaco').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('espaco_id').value;
            const payload = {
                fileira: document.getElementById('fileira').value.toUpperCase(),
                numero_espaco: parseInt(document.getElementById('numero_espaco').value),
                status: document.getElementById('status_espaco').value,
                temperatura_disponivel: parseFloat(document.getElementById('temperatura_disponivel').value)
            };

            const url = id ? `${BASE_URL}/camara-fria/espacos/${id}` : `${BASE_URL}/camara-fria/espacos`;
            const method = id ? 'PUT' : 'POST';

            try {
                const resposta = await fetch(url, {
                    method: method,
                    headers: HEADERS_PADRAO,
                    body: JSON.stringify(payload)
                });

                if (resposta.ok) {
                    alert(id ? 'Posição alterada com sucesso!' : 'Nova posição acrescentada!');
                    resetarFormulario();
                    listarEspacos();
                    notificarOutrasPaginas(); // Dispara atualização para o index.html
                } else {
                    const erro = await resposta.json();
                    alert(erro.detail || 'Erro ao salvar posição.');
                }
            } catch (err) {
                alert('Erro de conexão ao salvar posição.');
            }
        });

        // 3. JOGA OS DADOS NO FORMULÁRIO QUANDO CLICA EM ALTERAR
        function prepararEdicao(id, fileira, numero, status, temp) {
            if (status === 'ocupado') {
                alert('Não mude posições ocupadas com carga!');
                return;
            }
            document.getElementById('espaco_id').value = id;
            document.getElementById('fileira').value = fileira;
            document.getElementById('numero_espaco').value = numero;
            document.getElementById('status_espaco').value = status;
            document.getElementById('temperatura_disponivel').value = temp;
            document.getElementById('btnAcaoForm').innerText = 'Salvar Alteração';
        }

        // 4. DELETA UMA POSIÇÃO DA CÂMARA FRIA
        async function deletarEspaco(id) {
            if (!confirm('Deseja realmente remover esta prateleira da estrutura física?')) return;
            try {
                const r = await fetch(`${BASE_URL}/camara-fria/espacos/${id}`, {
                    method: 'DELETE',
                    headers: HEADERS_PADRAO
                });
                if (r.ok) {
                    alert('Posição excluída!');
                    listarEspacos();
                    notificarOutrasPaginas(); // Dispara atualização para o index.html
                } else {
                    const err = await r.json();
                    alert(err.detail || 'Erro ao excluir posição.');
                }
            } catch (e) {
                alert('Erro de conexão ao excluir.');
            }
        }

        function resetarFormulario() {
            document.getElementById('formEspaco').reset();
            document.getElementById('espaco_id').value = '';
            document.getElementById('btnAcaoForm').innerText = 'Adicionar';
        }

        // Inicializar tabela
        listarEspacos();
    </script>
</body>
</html>
